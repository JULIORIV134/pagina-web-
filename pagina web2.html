<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Preguntas Básicas</title>
</head>
<body>
  <h1>Preguntas Básicas</h1>
  <hr>

  <form>
    <p>¿Cómo te llamas?<br>
    <input type="text" name="nombre"></p>

    <p>¿Cuántos años tienes?<br>
    <input type="number" name="edad"></p>

    <p>¿Dónde estudias?<br>
    <input type="text" name="escuela"></p>

    <p>¿En qué grado o curso estás?<br>
    <input type="text" name="grado"></p>

    <p>¿Cuál es tu materia favorita?<br>
    <input type="text" name="materia"></p>

    <p>¿Qué te gusta hacer en tu tiempo libre?<br>
    <textarea name="pasatiempos" rows="3" cols="40"></textarea></p>

    <p>¿Tienes alguna meta o sueño para el futuro?<br>
    <textarea name="metas" rows="3" cols="40"></textarea></p>
  </form>

</body>
</html>
